<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Post</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">BlogHub ✨</div>

<nav>
<a href="index.html">← Back Home</a>
</nav>
</header>

<div class="container">

<div class="create-card card">

<h2>Edit Blog Post</h2>

<form id="edit-form">

<label>Title</label>

<input
type="text"
id="title"
required>

<label>Content</label>

<textarea
id="content"
rows="10"
required>
</textarea>

<button
type="submit"
class="publish-btn">

Update Post 🚀

</button>

</form>

</div>

</div>

<script src="edit.js"></script>

</body>
</html>
